            cd "$out"
            shasum -a 256 \
              "$prefix.dmg" \
              "$prefix.dmg.sha256" \
              "${prefix}-dSYMs.zip" \
              "${prefix}-SIGN-PROVENANCE.txt" \
              "${prefix}-NOTARIZE-PROVENANCE.txt"
          ) > "$release_manifest"
          gh release create "$RELEASE_TAG" \
            "$out/$prefix.dmg" \
            "$out/$prefix.dmg.sha256" \
            "$out/${prefix}-dSYMs.zip" \
            "$out/${prefix}-SIGN-PROVENANCE.txt" \
            "$out/${prefix}-NOTARIZE-PROVENANCE.txt" \
            "$release_manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "DessMetal $VERSION" \
            --generate-notes
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url,assets)"
          test "$(jq -r '.isDraft' <<< "$release_json")" = true
          expected_assets="$(printf '%s\n' \
            "$prefix.dmg" \
            "$prefix.dmg.sha256" \
            "${prefix}-dSYMs.zip" \
            "${prefix}-SIGN-PROVENANCE.txt" \
            "${prefix}-NOTARIZE-PROVENANCE.txt" \
            "${prefix}-GITHUB-RELEASE-ASSETS.txt" | sort)"
          actual_assets="$(jq -r '.assets[].name' <<< "$release_json" | sort)"
          test "$actual_assets" = "$expected_assets"
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo '### GitHub Release draft prepared for owner review'
            echo
            echo "- Existing tag was verified and was not created or moved: \`$RELEASE_TAG\`"
            echo "- Draft: $release_url"
            echo '- Publishing remains a separate manual action in GitHub.'
            echo '- The inner PKG remains distributed only inside the notarized DMG.'
          } >> "$GITHUB_STEP_SUMMARY"
