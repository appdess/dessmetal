        run: |
          set -Eeuo pipefail
          out="NeuralAmpModeler/build-mac/out"
          prefix="DessMetal-v${VERSION}-mac"
          pkg="$out/$prefix.pkg"
          dmg="$out/$prefix.dmg"
          dsym="$out/${prefix}-dSYMs.zip"
          manifest="$out/${prefix}-ARTIFACTS.txt"
          sign_provenance="$out/${prefix}-SIGN-PROVENANCE.txt"
          notary_provenance="$out/${prefix}-NOTARIZE-PROVENANCE.txt"
          expected="$(printf '%s\n' "$prefix.pkg" "$prefix.pkg.sha256" "$prefix.dmg" "$prefix.dmg.sha256" \
            "${prefix}-dSYMs.zip" "${prefix}-ARTIFACTS.txt" "${prefix}-SIGN-PROVENANCE.txt" \
            "${prefix}-NOTARIZE-PROVENANCE.txt" | sort)"
          actual="$(find "$out" -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$actual" = "$expected"
