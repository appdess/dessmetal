name: macOS release
run-name: macOS release ${{ inputs.operation }} ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Sign, notarize a prior signed run, or prepare a draft from a prior notarized run
        required: true
        type: choice
        options:
          - sign
          - notarize
          - draft
      release_tag:
        description: Existing tag, exactly vMAJOR.MINOR.PATCH (this workflow never creates it)
        required: true
        type: string
      release_version:
        description: Exact MAJOR.MINOR.PATCH expected in NeuralAmpModeler/config.h
        required: true
        type: string
      source_commit:
        description: Exact 40-character commit SHA pointed to by the existing tag
        required: true
        type: string
      approved_source_archive_sha256:
        description: Approved SHA-256 from git archive of source_commit
        required: true
        type: string
      ci_run_id:
        description: Successful trusted macOS validation run ID for source_commit; required only for sign
        required: false
        type: string
      codex_security_run_id:
        description: Successful deep Codex Security run ID for source_commit; required only for sign
        required: false
        type: string
      source_artifact_run_id:
        description: Prior sign/notarize run ID; leave blank only for sign
        required: false
        type: string
      approved_dmg_sha256:
        description: Exact signed/notarized DMG SHA-256; leave blank only for sign
        required: false
        type: string
      protected_environment_confirmation:
        description: Type macos-release after confirming the repository owner configured required environment reviewers
        required: true
        type: string
      artifact_transfer_confirmation:
        description: Explicit GitHub upload authorization; type the operation-specific phrase documented in RELEASE.md
        required: true
        type: string
      draft_confirmation:
        description: For draft, type OWNER GATES APPROVED AND PREPARE DRAFT followed by the tag
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: macos-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify immutable release inputs
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
      ci_run_id: ${{ steps.verify.outputs.ci_run_id }}
      codex_security_run_id: ${{ steps.verify_security.outputs.run_id }}
      codex_security_attestation_sha256: ${{ steps.verify_security.outputs.attestation_sha256 }}
      signed_artifact: ${{ steps.verify.outputs.signed_artifact }}
      notarized_artifact: ${{ steps.verify.outputs.notarized_artifact }}
    steps:
      # v4.2.2, resolved from the official actions/checkout repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fail closed unless tag, version, commit, and source hash agree
        id: verify
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SOURCE_HASH: ${{ inputs.approved_source_archive_sha256 }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CODEX_SECURITY_RUN_ID: ${{ inputs.codex_security_run_id }}
          SOURCE_RUN_ID: ${{ inputs.source_artifact_run_id }}
          APPROVED_DMG_HASH: ${{ inputs.approved_dmg_sha256 }}
          ENVIRONMENT_CONFIRMATION: ${{ inputs.protected_environment_confirmation }}
          TRANSFER_CONFIRMATION: ${{ inputs.artifact_transfer_confirmation }}
          DRAFT_CONFIRMATION: ${{ inputs.draft_confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$ENVIRONMENT_CONFIRMATION" = macos-release
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SOURCE_HASH" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE_COMMIT"
          version="$(awk -F '"' '/^#define PLUG_VERSION_STR / { print $2; exit }' NeuralAmpModeler/config.h)"
          test "$version" = "$RELEASE_VERSION"
          source_hash="$(git archive --format=tar HEAD | shasum -a 256 | awk '{print $1}')"
          test "$source_hash" = "$APPROVED_SOURCE_HASH"

          case "$OPERATION" in
            sign)
              expected_transfer="UPLOAD SIGNED CANDIDATE $RELEASE_TAG"
              ;;
            notarize)
              expected_transfer="UPLOAD NOTARIZED CANDIDATE $RELEASE_TAG"
              ;;
            draft)
              expected_transfer="UPLOAD DRAFT ASSETS $RELEASE_TAG"
              ;;
            *)
              exit 1
              ;;
          esac
          test "$TRANSFER_CONFIRMATION" = "$expected_transfer"

          if [[ "$OPERATION" == sign ]]; then
            [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$CODEX_SECURITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            ci_run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg source_commit "$SOURCE_COMMIT" \
              '(.path == ".github/workflows/macos-ci.yml" or
                 (.path | startswith(".github/workflows/macos-ci.yml@"))) and
               .name == "macOS validation" and
               (.event == "push" or .event == "workflow_dispatch") and
               .status == "completed" and .conclusion == "success" and
               .head_sha == $source_commit and .head_branch == "main" and
               .head_repository.full_name == $repository' <<< "$ci_run_json" >/dev/null
          else
            test -z "$CI_RUN_ID"
            test -z "$CODEX_SECURITY_RUN_ID"
          fi

          if [[ "$OPERATION" == notarize || "$OPERATION" == draft ]]; then
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$APPROVED_DMG_HASH" =~ ^[0-9a-f]{64}$ ]]
          else
            test -z "$SOURCE_RUN_ID"
            test -z "$APPROVED_DMG_HASH"
          fi
          if [[ "$OPERATION" == draft ]]; then
            test "$DRAFT_CONFIRMATION" = "OWNER GATES APPROVED AND PREPARE DRAFT $RELEASE_TAG"
          else
            test -z "$DRAFT_CONFIRMATION"
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$SOURCE_COMMIT"
            printf 'ci_run_id=%s\n' "$CI_RUN_ID"
            printf 'signed_artifact=dessmetal-v%s-signed-%s\n' "$version" "$SOURCE_COMMIT"
            printf 'notarized_artifact=dessmetal-v%s-notarized-%s\n' "$version" "$SOURCE_COMMIT"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Release input gate passed'
            echo
            echo "- Operation: \`$OPERATION\`"
            echo "- Existing tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Version: \`$version\`"
            echo "- Approved source archive SHA-256: \`$source_hash\`"
            if [[ "$OPERATION" == sign ]]; then
              echo "- Successful trusted macOS validation run: \`$CI_RUN_ID\`"
              echo "- Successful deep Codex Security run: \`$CODEX_SECURITY_RUN_ID\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the exact successful deep Codex Security run
        if: inputs.operation == 'sign'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_SECURITY_RUN_ID: ${{ inputs.codex_security_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$CODEX_SECURITY_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_commit "$SOURCE_COMMIT" \
            '(.path == ".github/workflows/codex-security.yml" or
               (.path | startswith(".github/workflows/codex-security.yml@"))) and
             .name == "Codex Security release scan" and
             .event == "workflow_dispatch" and
             .status == "completed" and .conclusion == "success" and
             .head_sha == $source_commit and .head_branch == "main" and
             .head_repository.full_name == $repository' <<< "$run_json" >/dev/null

      # v4.3.0, resolved from the official actions/download-artifact repository.
      - name: Download the exact sanitized Codex Security attestation
        if: inputs.operation == 'sign'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dessmetal-codex-security-attestation-${{ inputs.source_commit }}
          path: ${{ runner.temp }}/dessmetal-codex-security-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.codex_security_run_id }}

      - name: Fail unless the deep-scan attestation is exact and complete
        if: inputs.operation == 'sign'
        id: verify_security
        env:
          CODEX_SECURITY_RUN_ID: ${{ inputs.codex_security_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_SOURCE_HASH: ${{ inputs.approved_source_archive_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          attestation_root="$RUNNER_TEMP/dessmetal-codex-security-attestation"
          attestation="$attestation_root/attestation.json"
          checksum="$attestation_root/attestation.json.sha256"
          expected_files="$(printf '%s\n' attestation.json attestation.json.sha256 | sort)"
          actual_files="$(find "$attestation_root" -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$actual_files" = "$expected_files"
          test "$(wc -l < "$checksum" | tr -d ' ')" = 1
          [[ "$(< "$checksum")" =~ ^[0-9a-f]{64}\ \ attestation\.json$ ]]
          (cd "$attestation_root" && shasum -a 256 -c attestation.json.sha256)
          attestation_hash="$(shasum -a 256 "$attestation" | awk '{print $1}')"

          jq -e \
            --argjson run_id "$CODEX_SECURITY_RUN_ID" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg source_hash "$APPROVED_SOURCE_HASH" \
            --arg release_tag "$RELEASE_TAG" \
            'keys == [
               "blocking_findings", "codex_auth_helper_invocations", "codex_auth_helper_refresh_gap_ms",
               "codex_auth_helper_refresh_interval_ms", "codex_auth_helper_refresh_proven", "coverage",
               "event", "model", "policy_threshold", "reasoning_effort", "release_tag", "repository",
               "result", "scan_mode", "scanner_lock_sha256", "scanner_package",
               "scanner_package_sha256", "schema",
               "sealed_artifact_sha256", "source_archive_sha256", "source_commit", "target",
               "total_findings", "wif_provider_id", "wif_service_account_id", "workflow",
               "workflow_run_id", "workflow_sha"
             ] and
             .schema == "dessmetal.codex-security-attestation.v1" and
             .repository == "appdess/dessmetal" and
             .workflow == ".github/workflows/codex-security.yml" and
             .workflow_run_id == $run_id and
             .workflow_sha == $source_commit and
             .event == "workflow_dispatch" and
             .result == "pass" and
             .scan_mode == "deep" and .target == "repository" and
             .source_commit == $source_commit and
             .source_archive_sha256 == $source_hash and
             .release_tag == $release_tag and
             .coverage == "complete" and
             .policy_threshold == "high" and
             .blocking_findings == 0 and
             (.total_findings | type == "number" and . >= 0 and floor == .) and
             .model == "gpt-5.6-sol" and .reasoning_effort == "xhigh" and
             .scanner_package == "@openai/codex-security@0.1.1" and
             .scanner_package_sha256 == "ee8106dcf241fa6a630cad5c74a228aec49c391a09e99d87a9947a53fd630800" and
             .scanner_lock_sha256 == "3aee5c0d074b70e5ee79976a67ceaab724072dfa04e7ecd5b8d1c1fc38ec7e05" and
             .wif_provider_id == "idp_qogpN1ZpwDCu3NroaZ6OjeH4" and
             .wif_service_account_id == "user-LB72xJXEqSaonyw7fADmZ9Mk" and
             (.codex_auth_helper_invocations | type == "number" and . >= 2 and floor == .) and
             .codex_auth_helper_refresh_interval_ms == 120000 and
             (.codex_auth_helper_refresh_gap_ms | type == "number" and . >= 119900 and floor == .) and
             .codex_auth_helper_refresh_proven == true and
             (.sealed_artifact_sha256 | keys == ["coverage.json", "findings.json", "scan-manifest.json"]) and
             (all(.sealed_artifact_sha256[]; test("^[0-9a-f]{64}$")))' \
            "$attestation" >/dev/null
          {
            printf 'run_id=%s\n' "$CODEX_SECURITY_RUN_ID"
            printf 'attestation_sha256=%s\n' "$attestation_hash"
          } >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Deep Codex Security attestation verified'
            echo
            echo "- Run: \`$CODEX_SECURITY_RUN_ID\`"
            echo "- Attestation SHA-256: \`$attestation_hash\`"
            echo '- Exact source commit, archive hash, tag, complete coverage, and no high/critical findings matched.'
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    name: Sign immutable source candidate
    if: inputs.operation == 'sign'
    needs: gate
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    # Naming this environment does not configure protection; the repository
    # owner must add required reviewers in GitHub settings.
    environment:
      name: macos-release
    steps:
      # v4.2.2, resolved from the official actions/checkout repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Re-verify source before exposing signing credentials
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.gate.outputs.commit }}
          APPROVED_SOURCE_HASH: ${{ inputs.approved_source_archive_sha256 }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE_COMMIT"
          test "$(awk -F '"' '/^#define PLUG_VERSION_STR / { print $2; exit }' NeuralAmpModeler/config.h)" = "$RELEASE_VERSION"
          test "$(git archive --format=tar HEAD | shasum -a 256 | awk '{print $1}')" = "$APPROVED_SOURCE_HASH"
          test -z "$(git status --porcelain)"

      - name: Import Developer ID identities into a temporary keychain
        id: signing_keychain
        env:
          CERTIFICATES_P12_BASE64: ${{ secrets.DESSMETAL_SIGNING_CERTIFICATES_P12_BASE64 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.DESSMETAL_SIGNING_CERTIFICATES_P12_PASSWORD }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${CERTIFICATES_P12_BASE64:?Missing environment secret DESSMETAL_SIGNING_CERTIFICATES_P12_BASE64}"
          : "${CERTIFICATES_P12_PASSWORD:?Missing environment secret DESSMETAL_SIGNING_CERTIFICATES_P12_PASSWORD}"
          keychain="$RUNNER_TEMP/dessmetal-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_file="$RUNNER_TEMP/dessmetal-signing-certificates.p12"
          printf '%s' "$CERTIFICATES_P12_BASE64" | /usr/bin/base64 -D > "$certificate_file"
          chmod 600 "$certificate_file"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate_file" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATES_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v "$keychain"
          printf 'keychain=%s\n' "$keychain" >> "$GITHUB_OUTPUT"

      - name: Build the signed candidate with the repository release script
        env:
          DESSMETAL_APP_IDENTITY: ${{ vars.DESSMETAL_APP_IDENTITY }}
          DESSMETAL_INSTALLER_IDENTITY: ${{ vars.DESSMETAL_INSTALLER_IDENTITY }}
        run: bash package_mac.sh

      - name: Delete temporary signing material
        if: always()
        env:
          KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: |
          set -Eeuo pipefail
          keychain="${KEYCHAIN:-$RUNNER_TEMP/dessmetal-signing.keychain-db}"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
          rm -f "$RUNNER_TEMP/dessmetal-signing-certificates.p12"

      - name: Verify and summarize the signed candidate
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          CONFIGURED_APP_IDENTITY: ${{ vars.DESSMETAL_APP_IDENTITY }}
          CONFIGURED_INSTALLER_IDENTITY: ${{ vars.DESSMETAL_INSTALLER_IDENTITY }}
        run: |
          set -Eeuo pipefail
          app_identity="${CONFIGURED_APP_IDENTITY:-Developer ID Application: Alexander Dess (6756YXU4J7)}"
          installer_identity="${CONFIGURED_INSTALLER_IDENTITY:-Developer ID Installer: Alexander Dess (6756YXU4J7)}"
          [[ "$app_identity" =~ ^Developer\ ID\ Application:\ .+\ \(([A-Z0-9]{10})\)$ ]]
          app_team="${BASH_REMATCH[1]}"
          [[ "$installer_identity" =~ ^Developer\ ID\ Installer:\ .+\ \(([A-Z0-9]{10})\)$ ]]
          installer_team="${BASH_REMATCH[1]}"
          test "$app_team" = 6756YXU4J7
          test "$installer_team" = "$app_team"

          out="NeuralAmpModeler/build-mac/out"
          products="NeuralAmpModeler/build-mac/release/products"
          prefix="DessMetal-v${VERSION}-mac"
          pkg="$out/$prefix.pkg"
          dmg="$out/$prefix.dmg"
          dsym="$out/${prefix}-dSYMs.zip"
          manifest="$out/${prefix}-ARTIFACTS.txt"
          app="$products/Applications/DessMetal.app"
          au="$products/Components/DessMetal.component"
          vst3="$products/VST3/DessMetal.vst3"
          expected="$(printf '%s\n' "$prefix.pkg" "$prefix.pkg.sha256" "$prefix.dmg" "$prefix.dmg.sha256" \
            "${prefix}-dSYMs.zip" "${prefix}-ARTIFACTS.txt" | LC_ALL=C sort)"
          actual="$(find "$out" -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort)"
          test "$actual" = "$expected"
          (cd "$out" && shasum -a 256 -c "$(basename "$pkg.sha256")" "$(basename "$dmg.sha256")" "$(basename "$manifest")")

          expected_irs=$'ENGL-5150-V30-Mix.wav\nENGL-5153-V30-Sheffield-Mix.wav\nENGL-MIX.wav\nENGL-ORG.1.wav\nENGL-V30-1.wav\nENGL-V30-2.wav\nENGL-V30-3.wav\nENGL-V30-4.wav\nENGL-V30-Sheffield-Mix.wav\nENGL-V30-UK-SM57+E609.1.wav\nENGL-V30.wav\nbeasty-trio.wav\ncutout-switch.wav\nerretic-bloodbath.wav\nesele-dying.wav\npolestar.wav'
          verify_ir_manifest() {
            local bundle="$1"
            local actual_irs
            actual_irs="$(cd "$bundle/Contents/Resources/IRs" && \
              find . -type f -iname '*.wav' -print | sed 's|^./||' | LC_ALL=C sort)"
            test "$actual_irs" = "$expected_irs"
          }
          verify_developer_id_bundle() {
            local bundle="$1"
            local metadata
            codesign --verify --strict --verbose=2 "$bundle"
            metadata="$(codesign -dvvv "$bundle" 2>&1)"
            grep -Fqx "Authority=$app_identity" <<< "$metadata"
            grep -Fqx 'Authority=Developer ID Certification Authority' <<< "$metadata"
            grep -Fqx "TeamIdentifier=$app_team" <<< "$metadata"
            grep -Eq '^CodeDirectory .*flags=.*\(runtime\)' <<< "$metadata"
            grep -Eq '^Timestamp=.+' <<< "$metadata"
          }
          for bundle in "$app" "$au" "$vst3"; do
            test -d "$bundle"
            verify_ir_manifest "$bundle"
            verify_developer_id_bundle "$bundle"
          done

          pkg_signature="$(pkgutil --check-signature "$pkg" 2>&1)"
          grep -Fq 'Status: signed by a developer certificate issued by Apple for distribution' <<< "$pkg_signature"
          grep -Fq 'Signed with a trusted timestamp on:' <<< "$pkg_signature"
          grep -Fq "1. $installer_identity" <<< "$pkg_signature"
          grep -Fq '2. Developer ID Certification Authority' <<< "$pkg_signature"

          codesign --verify --strict --verbose=2 "$dmg"
          dmg_metadata="$(codesign -dvvv "$dmg" 2>&1)"
          grep -Fqx "Authority=$app_identity" <<< "$dmg_metadata"
          grep -Fqx 'Authority=Developer ID Certification Authority' <<< "$dmg_metadata"
          grep -Fqx "TeamIdentifier=$app_team" <<< "$dmg_metadata"
          grep -Eq '^Timestamp=.+' <<< "$dmg_metadata"
          hdiutil verify "$dmg"

          expanded_pkg="$RUNNER_TEMP/dessmetal-signed-installer-expanded"
          payload_root="$RUNNER_TEMP/dessmetal-signed-payloads"
          pkgutil --expand "$pkg" "$expanded_pkg"
          verify_component_install_policy() {
            local package_info="$1"
            local expected_location="$2"
            local expected_bundle_id="$3"
            local expected_bundle_path="$4"
            test -f "$package_info"
            test "$(xmllint --xpath 'string(/pkg-info/@install-location)' "$package_info")" = "$expected_location"
            test "$(xmllint --xpath 'string(/pkg-info/@relocatable)' "$package_info")" = false
            test "$(xmllint --xpath 'count(/pkg-info/relocate/*)' "$package_info")" = 0
            test "$(xmllint --xpath 'count(/pkg-info/strict-identifier/bundle)' "$package_info")" = 1
            test "$(xmllint --xpath 'string(/pkg-info/strict-identifier/bundle/@id)' "$package_info")" = "$expected_bundle_id"
            test "$(xmllint --xpath 'count(/pkg-info/bundle)' "$package_info")" = 1
            test "$(xmllint --xpath "count(/pkg-info/bundle[@path='./$expected_bundle_path' and @id='$expected_bundle_id'])" "$package_info")" = 1
          }
          verify_component_install_policy \
            "$expanded_pkg/DessMetal_APP.pkg/PackageInfo" \
            /Applications com.AlexanderDess.app.DessMetal DessMetal.app
          verify_component_install_policy \
            "$expanded_pkg/DessMetal_AU.pkg/PackageInfo" \
            /Library/Audio/Plug-Ins/Components com.AlexanderDess.audiounit.DessMetal DessMetal.component
          verify_component_install_policy \
            "$expanded_pkg/DessMetal_VST3.pkg/PackageInfo" \
            /Library/Audio/Plug-Ins/VST3 com.AlexanderDess.vst3.DessMetal DessMetal.vst3
          mkdir -p "$payload_root"
          extract_component() {
            local component="$1"
            local destination="$2"
            mkdir -p "$destination"
            gzip -dc "$expanded_pkg/DessMetal_${component}.pkg/Payload" | \
              (cd "$destination" && cpio -idm)
          }
          compare_payload() {
            local label="$1"
            local staged="$2"
            local installed="$3"
            local staged_manifest="$RUNNER_TEMP/${label}-staged-files.txt"
            local installed_manifest="$RUNNER_TEMP/${label}-payload-files.txt"
            (cd "$staged" && find . \( -type f -o -type l \) ! -name '._*' -print | LC_ALL=C sort) \
              > "$staged_manifest"
            (cd "$installed" && find . \( -type f -o -type l \) ! -name '._*' -print | LC_ALL=C sort) \
              > "$installed_manifest"
            cmp "$staged_manifest" "$installed_manifest"
            while IFS= read -r entry; do
              if [[ -L "$staged/$entry" ]]; then
                test -L "$installed/$entry"
                test "$(readlink "$staged/$entry")" = "$(readlink "$installed/$entry")"
              else
                test ! -L "$installed/$entry"
                cmp "$staged/$entry" "$installed/$entry"
              fi
            done < "$staged_manifest"
          }
          extract_component APP "$payload_root/app"
          extract_component AU "$payload_root/au"
          extract_component VST3 "$payload_root/vst3"
          compare_payload app "$app" "$payload_root/app/DessMetal.app"
          compare_payload au "$au" "$payload_root/au/DessMetal.component"
          compare_payload vst3 "$vst3" "$payload_root/vst3/DessMetal.vst3"

          unzip -tq "$dsym"
          dsym_root="$RUNNER_TEMP/dessmetal-signed-dsyms"
          mkdir -p "$dsym_root"
          unzip -q "$dsym" -d "$dsym_root"
          uuid_set() {
            local binary="$1"
            local uuids
            uuids="$(dwarfdump --uuid "$binary" | awk '/^UUID: / { print toupper($2) " " $3 }' | LC_ALL=C sort)"
            test "$(wc -l <<< "$uuids" | tr -d ' ')" = 2
            grep -Eq '^[0-9A-F-]{36} \(arm64\)$' <<< "$uuids"
            grep -Eq '^[0-9A-F-]{36} \(x86_64\)$' <<< "$uuids"
            printf '%s\n' "$uuids"
          }
          for spec in \
            "Applications/DessMetal.app|DessMetal.app.dSYM" \
            "Components/DessMetal.component|DessMetal.component.dSYM" \
            "VST3/DessMetal.vst3|DessMetal.vst3.dSYM"; do
            bundle_path="${spec%%|*}"
            dsym_name="${spec#*|}"
            binary="$products/$bundle_path/Contents/MacOS/DessMetal"
            debug_binary="$dsym_root/dSYMs/$dsym_name/Contents/Resources/DWARF/DessMetal"
            test -f "$debug_binary"
            test "$(uuid_set "$binary")" = "$(uuid_set "$debug_binary")"
          done

          dmg_mount="$RUNNER_TEMP/dessmetal-signed-dmg"
          mkdir -p "$dmg_mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$dmg_mount" "$dmg"
          trap 'hdiutil detach "$dmg_mount" >/dev/null 2>&1 || true' EXIT
          cmp "$pkg" "$dmg_mount/$(basename "$pkg")"
          hdiutil detach "$dmg_mount"
          trap - EXIT

          dmg_hash="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          provenance="$out/${prefix}-SIGN-PROVENANCE.txt"
          {
            echo 'format=dessmetal-release-provenance-v3'
            echo "workflow_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo 'operation=sign'
            echo "release_tag=${{ inputs.release_tag }}"
            echo "version=$VERSION"
            echo "source_commit=${{ needs.gate.outputs.commit }}"
            echo "source_archive_sha256=${{ inputs.approved_source_archive_sha256 }}"
            echo "ci_run_id=${{ needs.gate.outputs.ci_run_id }}"
            echo "codex_security_run_id=${{ needs.gate.outputs.codex_security_run_id }}"
            echo "codex_security_attestation_sha256=${{ needs.gate.outputs.codex_security_attestation_sha256 }}"
            echo "dmg_sha256=$dmg_hash"
          } > "$provenance"
          {
            echo '### Signed candidate created; nothing was notarized or published'
            echo
            echo "- Candidate artifact: \`${{ needs.gate.outputs.signed_artifact }}\`"
            echo "- Bound macOS validation run: \`${{ needs.gate.outputs.ci_run_id }}\`"
            echo "- Bound deep Codex Security run: \`${{ needs.gate.outputs.codex_security_run_id }}\`"
            echo "- Signed DMG SHA-256 requiring separate approval: \`$dmg_hash\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # v4.6.2, resolved from the official actions/upload-artifact repository.
      - name: Retain signed candidate in Actions for 14 days (explicitly authorized)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.gate.outputs.signed_artifact }}
          path: NeuralAmpModeler/build-mac/out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  notarize:
    name: Notarize exact approved signed DMG
    if: inputs.operation == 'notarize'
    needs: gate
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    # Naming this environment does not configure protection; the repository
    # owner must add required reviewers in GitHub settings.
    environment:
      name: macos-release
    steps:
      # v4.2.2, resolved from the official actions/checkout repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.gate.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Re-verify source before exposing notarization credentials
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
          SOURCE_COMMIT: ${{ needs.gate.outputs.commit }}
          APPROVED_SOURCE_HASH: ${{ inputs.approved_source_archive_sha256 }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE_COMMIT"
          test "$(awk -F '"' '/^#define PLUG_VERSION_STR / { print $2; exit }' NeuralAmpModeler/config.h)" = "$RELEASE_VERSION"
          test "$(git archive --format=tar HEAD | shasum -a 256 | awk '{print $1}')" = "$APPROVED_SOURCE_HASH"
          test -z "$(git status --porcelain)"

      - name: Verify the prior run is the matching successful sign operation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_artifact_run_id }}
          CURRENT_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e \
            --arg workflow_sha "$CURRENT_WORKFLOW_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            '(.path == ".github/workflows/macos-release.yml" or
              (.path | startswith(".github/workflows/macos-release.yml@"))) and
             .event == "workflow_dispatch" and .conclusion == "success" and
             .head_sha == $workflow_sha and .head_branch == "main" and
             .head_repository.full_name == $repository' <<< "$run_json" >/dev/null

      # v4.3.0, resolved from the official actions/download-artifact repository.
      - name: Download the exact prior signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.gate.outputs.signed_artifact }}
          path: NeuralAmpModeler/build-mac/out
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_artifact_run_id }}

      - name: Fail unless the complete signed set and approved DMG hash verify
        id: verify_signed
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          APPROVED_DMG_HASH: ${{ inputs.approved_dmg_sha256 }}
        run: |
          set -Eeuo pipefail
          out="NeuralAmpModeler/build-mac/out"
          prefix="DessMetal-v${VERSION}-mac"
          pkg="$out/$prefix.pkg"
          dmg="$out/$prefix.dmg"
          dsym="$out/${prefix}-dSYMs.zip"
          manifest="$out/${prefix}-ARTIFACTS.txt"
          provenance="$out/${prefix}-SIGN-PROVENANCE.txt"
          expected="$(printf '%s\n' "$prefix.pkg" "$prefix.pkg.sha256" "$prefix.dmg" "$prefix.dmg.sha256" \
            "${prefix}-dSYMs.zip" "${prefix}-ARTIFACTS.txt" "${prefix}-SIGN-PROVENANCE.txt" | sort)"
          actual="$(find "$out" -maxdepth 1 -type f -exec basename {} \; | sort)"
          test "$actual" = "$expected"
          (cd "$out" && shasum -a 256 -c "$(basename "$pkg.sha256")" "$(basename "$dmg.sha256")" "$(basename "$manifest")")
          test "$(shasum -a 256 "$dmg" | awk '{print $1}')" = "$APPROVED_DMG_HASH"
          pkgutil --check-signature "$pkg"
          codesign --verify --verbose=2 "$dmg"
          hdiutil verify "$dmg"
          unzip -tq "$dsym"
          test "$(wc -l < "$provenance" | tr -d ' ')" = 12
          ci_run_id="$(awk -F= '$1 == "ci_run_id" { print $2 }' "$provenance")"
          codex_security_run_id="$(awk -F= '$1 == "codex_security_run_id" { print $2 }' "$provenance")"
          codex_security_attestation_sha256="$(awk -F= '$1 == "codex_security_attestation_sha256" { print $2 }' "$provenance")"
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$codex_security_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$codex_security_attestation_sha256" =~ ^[0-9a-f]{64}$ ]]
          for line in \
            'format=dessmetal-release-provenance-v3' \
            "workflow_sha=$GITHUB_SHA" \
            "run_id=${{ inputs.source_artifact_run_id }}" \
            'operation=sign' \
            "release_tag=${{ inputs.release_tag }}" \
            "version=$VERSION" \
            "source_commit=${{ needs.gate.outputs.commit }}" \
            "source_archive_sha256=${{ inputs.approved_source_archive_sha256 }}" \
            "ci_run_id=$ci_run_id" \
            "codex_security_run_id=$codex_security_run_id" \
            "codex_security_attestation_sha256=$codex_security_attestation_sha256" \
            "dmg_sha256=$APPROVED_DMG_HASH"; do
            grep -Fqx "$line" "$provenance"
          done
          {
            printf 'ci_run_id=%s\n' "$ci_run_id"
            printf 'codex_security_run_id=%s\n' "$codex_security_run_id"
            printf 'codex_security_attestation_sha256=%s\n' "$codex_security_attestation_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Store App Store Connect credentials in a temporary keychain
        id: notary_keychain
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.DESSMETAL_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.DESSMETAL_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.DESSMETAL_NOTARY_ISSUER_ID }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${NOTARY_KEY_P8_BASE64:?Missing environment secret DESSMETAL_NOTARY_KEY_P8_BASE64}"
          : "${NOTARY_KEY_ID:?Missing environment secret DESSMETAL_NOTARY_KEY_ID}"
          keychain="$RUNNER_TEMP/dessmetal-notary.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          key_file="$RUNNER_TEMP/dessmetal-notary-key.p8"
          profile="dessmetal-notary-$GITHUB_RUN_ID"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$key_file"
          chmod 600 "$key_file"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          notary_arguments=(--key "$key_file" --key-id "$NOTARY_KEY_ID")
          # Team API keys require an issuer UUID. Individual API keys must omit it.
          if [[ -n "$NOTARY_ISSUER_ID" ]]; then
            notary_arguments+=(--issuer "$NOTARY_ISSUER_ID")
          fi
          xcrun notarytool store-credentials "$profile" \
            "${notary_arguments[@]}" --keychain "$keychain" --validate
          printf 'keychain=%s\n' "$keychain" >> "$GITHUB_OUTPUT"
          printf 'profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple with the repository script
        env:
          DESSMETAL_NOTARY_PROFILE: ${{ steps.notary_keychain.outputs.profile }}
          APPROVED_DMG_HASH: ${{ inputs.approved_dmg_sha256 }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -Eeuo pipefail
          out="NeuralAmpModeler/build-mac/out"
          provenance="$out/DessMetal-v${VERSION}-mac-SIGN-PROVENANCE.txt"
          held_provenance="$RUNNER_TEMP/$(basename "$provenance")"
          test -f "$provenance"
          test ! -e "$held_provenance"
          mv "$provenance" "$held_provenance"
          restore_sign_provenance() {
            if [[ -f "$held_provenance" ]]; then
              mkdir -p "$out"
              mv "$held_provenance" "$provenance"
            fi
          }
          trap restore_sign_provenance EXIT
          bash notarize_mac.sh "$APPROVED_DMG_HASH"
          restore_sign_provenance
          trap - EXIT

      - name: Delete temporary notarization material
        if: always()
        env:
          KEYCHAIN: ${{ steps.notary_keychain.outputs.keychain }}
        run: |
          set -Eeuo pipefail
          keychain="${KEYCHAIN:-$RUNNER_TEMP/dessmetal-notary.keychain-db}"
          if [[ -e "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
          rm -f "$RUNNER_TEMP/dessmetal-notary-key.p8"

      - name: Verify and summarize the notarized result
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -Eeuo pipefail
          out="NeuralAmpModeler/build-mac/out"
          prefix="DessMetal-v${VERSION}-mac"
          pkg="$out/$prefix.pkg"
          dmg="$out/$prefix.dmg"
          dsym="$out/${prefix}-dSYMs.zip"
          manifest="$out/${prefix}-ARTIFACTS.txt"
          (cd "$out" && shasum -a 256 -c "$(basename "$pkg.sha256")" "$(basename "$dmg.sha256")" "$(basename "$manifest")")
          pkgutil --check-signature "$pkg"
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          spctl --assess --type install --verbose=2 "$pkg"
          unzip -tq "$dsym"
          dmg_hash="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          provenance="$out/${prefix}-NOTARIZE-PROVENANCE.txt"
          {
            echo 'format=dessmetal-release-provenance-v3'
            echo "workflow_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo 'operation=notarize'
            echo "release_tag=${{ inputs.release_tag }}"
            echo "version=$VERSION"
            echo "source_commit=${{ needs.gate.outputs.commit }}"
            echo "source_archive_sha256=${{ inputs.approved_source_archive_sha256 }}"
            echo "validation_ci_run_id=${{ steps.verify_signed.outputs.ci_run_id }}"
            echo "codex_security_run_id=${{ steps.verify_signed.outputs.codex_security_run_id }}"
            echo "codex_security_attestation_sha256=${{ steps.verify_signed.outputs.codex_security_attestation_sha256 }}"
            echo "source_artifact_run_id=${{ inputs.source_artifact_run_id }}"
            echo "approved_signed_dmg_sha256=${{ inputs.approved_dmg_sha256 }}"
            echo "notarized_dmg_sha256=$dmg_hash"
          } > "$provenance"
          {
            echo '### Notarized candidate created; nothing was published'
            echo
            echo "- Candidate artifact: \`${{ needs.gate.outputs.notarized_artifact }}\`"
            echo "- Post-staple DMG SHA-256 requiring separate approval: \`$dmg_hash\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # v4.6.2, resolved from the official actions/upload-artifact repository.
      - name: Retain notarized candidate in Actions for 14 days (explicitly authorized)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.gate.outputs.notarized_artifact }}
          path: NeuralAmpModeler/build-mac/out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  draft:
    name: Prepare exact approved notarized draft
    if: inputs.operation == 'draft'
    needs: gate
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    # Naming this environment does not configure protection; the repository
    # owner must add required reviewers in GitHub settings.
    environment:
      name: macos-release
    steps:
      # v4.2.2, resolved from the official actions/checkout repository.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
