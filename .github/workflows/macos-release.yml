             .head_repository.full_name == $repository' <<< "$run_json" >/dev/null

      # v4.3.0, resolved from the official actions/download-artifact repository.
      - name: Download the exact prior notarized candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.gate.outputs.notarized_artifact }}
          path: NeuralAmpModeler/build-mac/out
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_artifact_run_id }}

      - name: Fail unless the notarized set and approved post-staple hash verify
        env:
          VERSION: ${{ needs.gate.outputs.version }}
