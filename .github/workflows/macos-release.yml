          test "$(shasum -a 256 "$dmg" | awk '{print $1}')" = "$APPROVED_DMG_HASH"
          pkgutil --check-signature "$pkg"
          codesign --verify --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          spctl --assess --type install --verbose=2 "$pkg"
          unzip -tq "$dsym"
          test "$(wc -l < "$sign_provenance" | tr -d ' ')" = 12
          for line in \
            'format=dessmetal-release-provenance-v3' \
            "workflow_sha=$GITHUB_SHA" \
            'operation=sign' \
            "release_tag=${{ inputs.release_tag }}" \
            "version=$VERSION" \
            "source_commit=${{ needs.gate.outputs.commit }}" \
            "source_archive_sha256=${{ inputs.approved_source_archive_sha256 }}"; do
            grep -Fqx "$line" "$sign_provenance"
          done
          ci_run_id="$(awk -F= '$1 == "ci_run_id" { print $2 }' "$sign_provenance")"
          codex_security_run_id="$(awk -F= '$1 == "codex_security_run_id" { print $2 }' "$sign_provenance")"
          codex_security_attestation_sha256="$(awk -F= '$1 == "codex_security_attestation_sha256" { print $2 }' "$sign_provenance")"
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$codex_security_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$codex_security_attestation_sha256" =~ ^[0-9a-f]{64}$ ]]
          signed_dmg_hash="$(awk -F= '$1 == "dmg_sha256" { print $2 }' "$sign_provenance")"
          [[ "$signed_dmg_hash" =~ ^[0-9a-f]{64}$ ]]
          sign_run_id="$(awk -F= '$1 == "source_artifact_run_id" { print $2 }' "$notary_provenance")"
          [[ "$sign_run_id" =~ ^[1-9][0-9]*$ ]]
          grep -Fqx "run_id=$sign_run_id" "$sign_provenance"
          test "$(wc -l < "$notary_provenance" | tr -d ' ')" = 14
          for line in \
            'format=dessmetal-release-provenance-v3' \
            "workflow_sha=$GITHUB_SHA" \
            "run_id=${{ inputs.source_artifact_run_id }}" \
            'operation=notarize' \
            "release_tag=${{ inputs.release_tag }}" \
            "version=$VERSION" \
            "source_commit=${{ needs.gate.outputs.commit }}" \
            "source_archive_sha256=${{ inputs.approved_source_archive_sha256 }}" \
            "validation_ci_run_id=$ci_run_id" \
            "codex_security_run_id=$codex_security_run_id" \
            "codex_security_attestation_sha256=$codex_security_attestation_sha256" \
            "approved_signed_dmg_sha256=$signed_dmg_hash" \
            "notarized_dmg_sha256=$APPROVED_DMG_HASH"; do
