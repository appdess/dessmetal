name: Codex Security PR dispatcher
run-name: Queue Codex Security for PR #${{ github.event.pull_request.number }}

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch protected Codex Security scan
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v4.2.2, resolved from the official actions/checkout repository.
      # pull_request_target keeps this workflow definition on trusted main. The
      # merge commit is treated as data only: no repository script is executed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Bind and dispatch the protected main workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_REQUEST_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          set -Eeuo pipefail
          post_status() {
            local state="$1"
            local description="$2"
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/statuses/$source_commit" \
              -f state="$state" \
              -f context='Codex Security / standard' \
              -f description="$description" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/codex-security.yml" \
              >/dev/null
          }
          report_failure() {
            local exit_code=$?
            if [[ "$exit_code" -ne 0 ]]; then
              post_status failure "Codex Security dispatch or trust validation failed" || true
            fi
            exit "$exit_code"
          }
          trap report_failure EXIT

          [[ "$PULL_REQUEST_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PULL_REQUEST_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_REQUEST_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD^1)" = "$PULL_REQUEST_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$PULL_REQUEST_HEAD_SHA"
          test "$(git rev-list --parents -n 1 HEAD | awk '{ print NF }')" = 3
          test "$PULL_REQUEST_BASE_REPOSITORY" = "$GITHUB_REPOSITORY"
          # OpenAI recommends withholding CI credentials from untrusted forks.
          # Contributors can ask the owner to reproduce a fork change on a
          # same-repository branch before this expensive protected gate runs.
          test "$PULL_REQUEST_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"

          test -z "$(git status --porcelain)"
          source_hash="$(git archive --format=tar HEAD | sha256sum | awk '{print $1}')"
          [[ "$source_hash" =~ ^[0-9a-f]{64}$ ]]

          post_status pending "Codex Security protected scan is queued"
          confirmation="SCAN DESSMETAL standard $source_commit"
          jq -n \
            --arg ref main \
            --arg scan_mode standard \
            --arg source_commit "$source_commit" \
            --arg source_hash "$source_hash" \
            --arg confirmation "$confirmation" \
            --arg pull_request_number "$PULL_REQUEST_NUMBER" \
            --arg pull_request_head_sha "$PULL_REQUEST_HEAD_SHA" \
            '{
              ref: $ref,
              inputs: {
                scan_mode: $scan_mode,
                source_commit: $source_commit,
                approved_source_archive_sha256: $source_hash,
                release_tag: "",
                max_cost_usd: "5",
                confirmation: $confirmation,
                pull_request_number: $pull_request_number,
                pull_request_head_sha: $pull_request_head_sha
              }
            }' | gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/codex-security.yml/dispatches" \
              --input -

          trap - EXIT
